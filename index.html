<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f6" />
    <meta name="description" content="Offline-first PWA для обліку робочого часу" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Облік часу" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html,
      body,
      #root {
        background: #eef2f6;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #0b0f14;
        }
      }

      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background: #eef2f6;
      }

      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #root {
        background: #0b0f14;
      }
    </style>
    <script>
      (() => {
        const storageKey = 'shifter-theme-preference';
        let preference = 'system';

        try {
          preference = localStorage.getItem(storageKey) ?? 'system';
        } catch {
          // Continue with the system preference if localStorage is unavailable.
        }

        const systemPrefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = preference === 'dark' || (preference !== 'light' && systemPrefersDark);
        const theme = dark ? 'dark' : 'light';
        const backgroundColor = dark ? '#0b0f14' : '#eef2f6';

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = backgroundColor;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', backgroundColor);
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute('content', dark ? 'black' : 'default');

        const isIPhone = /iPhone/i.test(navigator.userAgent);

        if (isIPhone) {
          const pixelRatio = Math.max(1, window.devicePixelRatio || 1);
          const width = Math.round(Math.min(screen.width, screen.height) * pixelRatio);
          const height = Math.round(Math.max(screen.width, screen.height) * pixelRatio);
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');

          canvas.width = width;
          canvas.height = height;

          if (context) {
            [
              ['light', '#eef2f6'],
              ['dark', '#0b0f14']
            ].forEach(([colorScheme, color]) => {
              context.fillStyle = color;
              context.fillRect(0, 0, width, height);

              const startupImage = document.createElement('link');
              startupImage.rel = 'apple-touch-startup-image';
              startupImage.media = `(prefers-color-scheme: ${colorScheme})`;
              startupImage.href = canvas.toDataURL('image/png');
              document.head.append(startupImage);
            });
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%pwa.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <title>Облік часу</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

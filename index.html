<!doctype html>
<html lang="uk" data-app-loading="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Offline-first PWA для обліку робочого часу" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Облік часу" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      html[data-app-loading='true'],
      html[data-app-loading='true'] body,
      html[data-app-loading='true'] #root {
        min-height: 100%;
        margin: 0;
        background: #0b0f14;
      }

      .app-splash {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        box-sizing: border-box;
        padding: calc(32px + env(safe-area-inset-top)) 24px
          calc(32px + env(safe-area-inset-bottom));
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(49, 94, 251, 0.22), transparent 34%),
          #0b0f14;
        color: #f3f6fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .app-splash__brand {
        display: grid;
        justify-items: center;
        gap: 24px;
        text-align: center;
      }

      .app-splash__logo {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.42);
        animation: app-splash-logo-in 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
        transform-origin: center;
      }

      .app-splash__copy {
        display: grid;
        gap: 8px;
      }

      .app-splash__copy h1,
      .app-splash__copy p {
        margin: 0;
      }

      .app-splash__copy h1 {
        font-size: clamp(1.8rem, 8vw, 2.35rem);
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      .app-splash__copy p {
        color: #a8b3c2;
        font-size: 0.9375rem;
      }

      .app-splash__loader {
        display: flex;
        min-height: 8px;
        align-items: center;
        gap: 7px;
      }

      .app-splash__loader span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #7c9dff;
        animation: app-splash-pulse 1.1s ease-in-out infinite;
      }

      .app-splash__loader span:nth-child(2) {
        animation-delay: 160ms;
      }

      .app-splash__loader span:nth-child(3) {
        animation-delay: 320ms;
      }

      @keyframes app-splash-logo-in {
        from {
          opacity: 0;
          transform: scale(0.86);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes app-splash-pulse {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }

        30% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__logo {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .app-splash__loader span {
          animation: none;
          opacity: 0.72;
        }
      }
    </style>
    <script>
      (() => {
        const storageKey = 'shifter-theme-preference';
        let preference = 'system';

        try {
          preference = localStorage.getItem(storageKey) ?? 'system';
        } catch {
          // Continue with the system preference if localStorage is unavailable.
        }

        const systemPrefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = preference === 'dark' || (preference !== 'light' && systemPrefersDark);
        const theme = dark ? 'dark' : 'light';

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = '#0b0f14';

      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%pwa.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <title>Облік часу</title>
  </head>
  <body>
    <div id="root">
      <main class="app-splash" role="status" aria-live="polite" aria-label="Завантаження">
        <div class="app-splash__brand">
          <img
            class="app-splash__logo"
            src="%BASE_URL%pwa.svg"
            alt=""
            width="96"
            height="96"
          />
          <div class="app-splash__copy">
            <h1>Облік часу</h1>
            <p>Готуємо ваш робочий день</p>
          </div>
          <span class="app-splash__loader" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
